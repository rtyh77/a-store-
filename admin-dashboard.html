<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم عطور الفخامة - Admin Dashboard</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-color: #d4af37;
            --dark-bg: #0a0e27;
            --darker-bg: #050810;
            --card-bg: #1a1f3a;
            --border-color: #2a2f4a;
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --success-color: #10b981;
            --danger-color: #ef4444;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--dark-bg); color: var(--text-primary); line-height: 1.6; }
        
        /* Login */
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, var(--darker-bg) 0%, var(--dark-bg) 100%); }
        .login-box { background: var(--card-bg); padding: 40px; border-radius: 15px; border: 2px solid var(--primary-color); width: 100%; max-width: 400px; text-align: center; }
        .login-box h1 { color: var(--primary-color); margin-bottom: 25px; font-size: 24px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--primary-color); font-size: 13px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background-color: var(--dark-bg); color: #fff; font-size: 14px; outline: none; }
        .login-btn, .btn-add { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--primary-color) 0%, #b8860b 100%); color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 15px; }
        
        /* Dashboard Layout */
        .dashboard-container { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: var(--card-bg); border-left: 2px solid var(--primary-color); padding: 20px; position: fixed; height: 100vh; right: 0; top: 0; }
        .logo-section { text-align: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .logo-section h2 { color: var(--primary-color); font-size: 18px; }
        .nav-menu { list-style: none; }
        .nav-item { margin-bottom: 10px; }
        .nav-link { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px; background: transparent; border: none; color: #fff; cursor: pointer; border-radius: 6px; font-size: 14px; text-align: right; }
        .nav-link.active, .nav-link:hover { background: var(--primary-color); color: #000; font-weight: bold; }
        .logout-btn { width: 100%; padding: 10px; background: var(--danger-color); color: #fff; border: none; border-radius: 6px; margin-top: 20px; cursor: pointer; font-weight: bold; }
        
        .main-content { margin-right: 250px; padding: 30px; flex: 1; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .header h1 { color: var(--primary-color); font-size: 24px; }
        
        /* Tab & Stats */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; text-align: center; }
        .stat-card-title { color: var(--text-secondary); font-size: 12px; }
        .stat-card-value { color: var(--primary-color); font-size: 22px; font-weight: bold; margin-top: 5px; }
        
        /* Tables */
        .table-container { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th { padding: 12px; color: var(--primary-color); border-bottom: 1px solid var(--border-color); font-size: 13px; }
        td { padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 13px; }
        .btn-del { background: var(--danger-color); color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        
        /* Modal */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal.show { display: flex; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--primary-color); padding: 20px; border-radius: 10px; width: 90%; max-width: 450px; }
        .close-btn { background: none; border: none; color: #fff; font-size: 20px; float: left; cursor: pointer; }

        @media (max-width: 768px) {
            .sidebar { width: 70px; padding: 10px; }
            .sidebar span:last-child { display: none; }
            .main-content { margin-right: 70px; padding: 15px; }
        }
    </style>
</head>
<body>

    <!-- تسجيل الدخول -->
    <div id="loginContainer" class="login-container">
        <div class="login-box">
            <h1>✨ عطور الفخامة ✨</h1>
            <p id="errorMsg" style="color:red; display:none; font-size:12px; margin-bottom:10px;">بيانات الدخول خاطئة!</p>
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="username" placeholder="admin">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button type="button" class="login-btn" onclick="handleLogin()">دخول لوحة التحكم</button>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashboardContainer" class="dashboard-container" style="display: none;">
        <aside class="sidebar">
            <div class="logo-section">
                <h2>✨ الفخامة</h2>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <button class="nav-link active" onclick="switchTab(event, 'dashboard')">
                        <span>📊</span><span>الرئيسية</span>
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" onclick="switchTab(event, 'products')">
                        <span>📦</span><span>المنتجات</span>
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" onclick="switchTab(event, 'settings')">
                        <span>⚙️</span><span>الإعدادات</span>
                    </button>
                </li>
            </ul>
            <button class="logout-btn" onclick="handleLogout()">خروج</button>
        </aside>

        <main class="main-content">
            <div class="header">
                <h1 id="pageTitle">لوحة المعلومات</h1>
                <span>المشرف: <strong>admin</strong></span>
            </div>

            <!-- الرئيسية -->
            <div id="dashboard" class="tab-content active">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-card-title">إجمالي المنتجات</div>
                        <div class="stat-card-value" id="totalProducts">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-title">حالة النظام</div>
                        <div class="stat-card-value" style="color: #10b981; font-size: 16px;">متصل وجاهز ✅</div>
                    </div>
                </div>
            </div>

            <!-- المنتجات -->
            <div id="products" class="tab-content">
                <button class="btn-add" style="width: auto; padding: 8px 15px; margin-bottom: 15px;" onclick="openModal()">+ إضافة عطر جديد</button>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>اسم العطر</th>
                                <th>الفئة</th>
                                <th>السعر</th>
                                <th>الكمية</th>
                                <th>إجراء</th>
                            </tr>
                        </thead>
                        <tbody id="productsList"></tbody>
                    </table>
                </div>
            </div>

            <!-- الإعدادات -->
            <div id="settings" class="tab-content">
                <div style="background: var(--card-bg); padding: 20px; border-radius: 8px; max-width: 400px;">
                    <h3 style="color:var(--primary-color); margin-bottom:15px;">معلومات المتجر</h3>
                    <p>اسم المتجر: <strong>عطور الفخامة</strong></p>
                    <p>رقم الهاتف: <strong>0656708603</strong></p>
                </div>
            </div>
        </main>
    </div>

    <!-- نافذة إضافة منتج -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h3 style="color:var(--primary-color); margin-bottom:15px;">إضافة عطر جديد</h3>
            <div class="form-group">
                <label>اسم العطر</label>
                <input type="text" id="pName">
            </div>
            <div class="form-group">
                <label>الفئة</label>
                <select id="pCategory">
                    <option value="رجالي">عطور رجالية</option>
                    <option value="نسائي">عطور نسائية</option>
                    <option value="شرقي">عطور شرقية</option>
                </select>
            </div>
            <div class="form-group">
                <label>السعر (دج)</label>
                <input type="number" id="pPrice">
            </div>
            <div class="form-group">
                <label>الكمية</label>
                <input type="number" id="pStock">
            </div>
            <button class="btn-add" onclick="saveProduct()">حفظ العطر</button>
        </div>
    </div>

    <script>
        // الدخول
        function handleLogin() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            if(u === "admin" && p === "fakhama2026") {
                document.getElementById('loginContainer').style.display = "none";
                document.getElementById('dashboardContainer').style.display = "flex";
                loadProducts();
            } else {
                document.getElementById('errorMsg').style.display = "block";
            }
        }

        // التنقل
        function switchTab(e, tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            e.currentTarget.classList.add('active');
        }

        function handleLogout() {
            document.getElementById('dashboardContainer').style.display = "none";
            document.getElementById('loginContainer').style.display = "flex";
        }

        // إدارة المنتجات بالكامل
        function openModal() { document.getElementById('productModal').classList.add('show'); }
        function closeModal() { document.getElementById('productModal').classList.remove('show'); }

        function saveProduct() {
            const name = document.getElementById('pName').value;
            const category = document.getElementById('pCategory').value;
            const price = document.getElementById('pPrice').value;
            const stock = document.getElementById('pStock').value;

            if(!name || !price) { alert("يرجى إدخال اسم العطر والسعر!"); return; }

            let products = JSON.parse(localStorage.getItem('perfumes')) || [];
            products.push({ id: Date.now(), name, category, price, stock });
            localStorage.setItem('perfumes', JSON.stringify(products));

            // تفريغ الحقول وإغلاق النافذة
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pStock').value = '';
            closeModal();
            loadProducts();
        }

        function loadProducts() {
            let products = JSON.parse(localStorage.getItem('perfumes')) || [];
            const tbody = document.getElementById('productsList');
            document.getElementById('totalProducts').innerText = products.length;
            
            tbody.innerHTML = '';
            if(products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#888;">لا توجد عطور مضافة بعد</td></tr>';
                return;
            }

            products.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${p.name}</strong></td>
                        <td>${p.category}</td>
                        <td>${p.price} دج</td>
                        <td>${p.stock}</td>
                        <td><button class="btn-del" onclick="deleteProduct(${p.id})">حذف</button></td>
                    </tr>
                `;
            });
        }

        function deleteProduct(id) {
            let products = JSON.parse(localStorage.getItem('perfumes')) || [];
            products = products.filter(p => p.id !== id);
            localStorage.setItem('perfumes', JSON.stringify(products));
            loadProducts();
        }
    </script>
</body>
</html>
