<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر عطور الفخامة ✨</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-color: #d4af37;
            --dark-bg: #0a0e27;
            --card-bg: #1a1f3a;
            --text-primary: #e8e8e8;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--dark-bg); 
            color: var(--text-primary); 
            line-height: 1.6; 
        }

        /* شريط التنقل */
        header {
            background-color: var(--card-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }
        header h1 { color: var(--primary-color); font-size: 28px; }

        /* قسم الترحيب */
        .hero {
            text-align: center;
            padding: 40px 20px;
        }
        .hero h2 { color: #fff; margin-bottom: 10px; }
        .hero p { color: #a0a0a0; }

        /* شبكة المنتجات */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        /* بطاقة المنتج */
        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--primary-color);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2); }
        .product-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #2a2f4a;
        }
        .product-title { color: #fff; font-size: 18px; margin-bottom: 5px; }
        .product-category { color: #a0a0a0; font-size: 13px; margin-bottom: 10px; }
        .product-price { color: var(--primary-color); font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        
        /* زر الطلب */
        .btn-order {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary-color) 0%, #b8860b 100%);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-order:hover { filter: brightness(1.1); }

        /* الفوتر */
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            border-top: 1px solid var(--primary-color);
            color: #a0a0a0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>✨ عطور الفخامة ✨</h1>
    </header>

    <div class="hero">
        <h2>اكتشف سحر العطور الأصيلة</h2>
        <p>تشكيلة مميزة من أرقى العطور التي تعبر عن شخصيتك</p>
    </div>

    <div class="container">
        <div class="products-grid" id="storeProducts">
            <!-- سيتم عرض المنتجات هنا تلقائياً من لوحة التحكم -->
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 - عطور الفخامة</p>
    </footer>

    <script>
        // دالة لجلب المنتجات من التخزين المحلي (التي أضفناها في لوحة التحكم)
        function loadStoreProducts() {
            // جلب المنتجات أو إنشاء مصفوفة فارغة إذا لم يوجد شيء
            const products = JSON.parse(localStorage.getItem('perfumes')) || [];
            const grid = document.getElementById('storeProducts');
            
            // إذا كان المتجر فارغاً
            if(products.length === 0) {
                grid.innerHTML = '<p style="text-align:center; width:100%; grid-column: 1 / -1; color:#a0a0a0; padding: 50px;">لا توجد منتجات حالياً. سيتم إضافة تشكيلة عطور جديدة قريباً! ⏳</p>';
                return;
            }
            
            grid.innerHTML = ''; // تنظيف الشبكة
            
            // إضافة كل منتج تم جلبه إلى واجهة المتجر
            products.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${p.image}" class="product-img" alt="${p.name}">
                        <h3 class="product-title">${p.name}</h3>
                        <p class="product-category">${p.category}</p>
                        <p class="product-price">${p.price} دج</p>
                        <button class="btn-order" onclick="orderProduct('${p.name}', '${p.price}')">اطلب الآن عبر واتساب 🛒</button>
                    </div>
                `;
            });
        }

        // دالة توجيه الزبون للواتساب لطلب المنتج
        function orderProduct(name, price) {
            const phone = "213656708603"; // رقمك الذي أضفته مسبقاً
            const message = `مرحباً، أريد طلب عطر: *${name}* بسعر *${price} دج*.`;
            const whatsappUrl = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }

        // تشغيل الدالة فور فتح الصفحة
        window.onload = loadStoreProducts;
    </script>
</body>
</html>
